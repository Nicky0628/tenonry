name: Tenonry 检查与构建

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: 安装 Linux 桌面构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev pkg-config
      - name: 准备 Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
      - name: 检查界面模块
        run: node scripts/check-ui.mjs
      - name: 检查格式
        run: cargo +stable fmt --all --check
      - name: 静态检查
        run: cargo +stable clippy --workspace --locked --all-targets -- -D warnings
      - name: 检查文档与示例
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo +stable doc -p tenonry --no-deps --locked
          cargo +stable test -p tenonry --doc --locked
      - name: 编译检查
        run: cargo +stable check --workspace --locked
      - name: 检查核心库打包
        if: runner.os == 'Linux'
        run: cargo +stable package -p tenonry --locked

  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 准备 Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
      - name: 检查核心库静态分析与编译
        run: |
          cargo +stable clippy -p tenonry --locked --all-targets -- -D warnings
          cargo +stable check -p tenonry --locked
