[workspace]
members = ["crates/tenon"]
default-members = ["crates/tenon"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
tenon = { path = "crates/tenon", version = "=0.1.0" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
fs2 = "0.4"
which = "8"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }

[profile.release]
lto = "thin"
strip = true
